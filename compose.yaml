name: raeltek-lni-reports
# Since 2026-11-07 the workflow runs in the n8n on the Mac mini, whose compose file
# (~/raeltek-server/n8n/compose.yaml there) runs Gotenberg beside n8n; n8n reaches it at http://gotenberg:3000.
# This file is the original MacBook Gotenberg (n8n reached it at http://host.docker.internal:3010),
# kept only for the MacBook rollback described in raeltek-outreach docs/n8n-setup.md.
services:
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    ports:
      # Only this machine can reach it.
      - "127.0.0.1:3010:3000"
    command:
      - gotenberg
      # The report is self-contained; don't let Chromium fetch anything from the network.
      - --chromium-deny-list=^(?!file:///tmp/).*
      - --api-timeout=60s
